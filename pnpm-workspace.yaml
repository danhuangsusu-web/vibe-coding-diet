packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: false
  core-js-pure: false
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.76'
  - '@ai-sdk/provider-utils@5.0.37'
  - '@ai-sdk/provider@4.0.11'
  - ai@7.0.94
  - tdesign-miniprogram@1.16.1
  - '@ai-sdk/openai-compatible@3.0.45'
